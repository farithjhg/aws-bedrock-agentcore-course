<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>AgentCore en 4 horas · Nova Assist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Concepto: la arquitectura es una placa base que se puebla capítulo a capítulo.
   Texto a la izquierda, placa a la derecha (cámara que se mueve), tira laboratorio → teoría abajo.
   Un solo mundo visual oscuro (circuito impreso), elegido a propósito: no cambia con el tema. */
:root{
  color-scheme: dark;
  --deep:#071d16; --board:#0e3124; --board-2:#154434; --board-3:#1d5642; --panel:#0a261d;
  --copper:#c8873a; --copper-hi:#f0b46a; --copper-dim:#5d4630;
  --silk:#eef2ea; --silk-2:#c9d7ce; --silk-dim:#9db3a6; --silk-faint:#7f9d8e; --line:#28584a;
  --led:#f5d547; --ok:#3fd08a; --warn:#f0a23b; --bad:#ff6b6b; --cloud:#5ab4f0; --data:#7fe3c9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--deep);color:var(--silk);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--led);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:10px;padding-inline:20px;padding-block:10px;box-sizing:border-box;
  background:radial-gradient(1200px 700px at 70% 40%, #0f3a2b 0%, var(--deep) 70%)}

/* Cabecera */
.top{display:flex;align-items:center;gap:18px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand b{font:900 17px/1 var(--display);font-stretch:125%;letter-spacing:.06em}
.brand span{font:400 12px/1 var(--mono);color:var(--silk-dim)}
.bled{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.rail{display:flex;gap:4px;align-items:center;flex:1;justify-content:center;min-width:0}
.rail .act{font:700 10px/1 var(--display);letter-spacing:.16em;color:var(--silk-faint);margin:0 4px 0 10px;text-transform:uppercase}
.rail button{width:24px;height:24px;border-radius:5px;border:1px solid var(--line);background:rgba(255,255,255,.03);font:600 11px/1 var(--mono);color:var(--silk-dim);cursor:pointer;padding:0}
.rail button.seen{border-color:var(--copper-dim);color:var(--copper-hi)}
.rail.blocks{gap:6px}
.rail.blocks button{width:auto;padding:0 10px;font:700 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.rail button.cur{background:var(--led);color:#1d1a05;border-color:var(--led);box-shadow:0 0 14px rgba(245,213,71,.5)}
.debts{display:flex;gap:5px;align-items:center}
.debts .dl{font:700 10px/1 var(--display);letter-spacing:.16em;color:var(--silk-faint);text-transform:uppercase;margin-right:4px;white-space:nowrap}
.pill{font:600 11px/1 var(--mono);padding:5px 6px;border-radius:5px;border:1px dashed rgba(157,179,166,.3);color:var(--silk-faint);transition:all .4s}
.pill.open{border:1px solid var(--bad);color:var(--bad);background:rgba(255,107,107,.1)}
.pill.partial{border:1px solid var(--warn);color:var(--warn);background:rgba(240,162,59,.12)}
.pill.paid{border:1px solid var(--ok);color:#06210f;background:var(--ok)}
.pill.pop{animation:pop .6s}

/* Cuerpo */
.main{position:relative;display:grid;grid-template-columns:minmax(340px,34%) minmax(0,1fr);gap:20px;min-height:0}
.panel{position:relative;overflow:auto;min-width:0;display:flex;flex-direction:column;gap:16px;padding:6px 6px 12px 2px;scrollbar-width:thin}
.stage{position:relative;overflow:hidden;border-radius:16px;border:1px solid #1f4a3b;min-width:0;cursor:pointer;
  background-color:var(--board);
  background-image:radial-gradient(circle at 1px 1px, rgba(238,242,234,.07) 1px, transparent 1.5px),
    radial-gradient(900px 600px at 60% 45%, rgba(255,255,255,.04), transparent 70%);
  background-size:22px 22px, 100% 100%;
  box-shadow:inset 0 0 120px rgba(0,0,0,.45)}
.world{position:absolute;left:0;top:0;width:1600px;height:1000px;transform-origin:0 0;will-change:transform;
  transition:transform 1.3s cubic-bezier(.65,0,.25,1), opacity .5s}
.world.nt{transition:none}
.world svg{position:absolute;left:0;top:0;overflow:visible}
.deco text{font:600 11px var(--mono);fill:rgba(238,242,234,.22);letter-spacing:.14em}

/* Zonas */
.zone{position:absolute;border-radius:20px;border:1.5px dashed rgba(90,180,240,.32);transition:all .6s;pointer-events:none}
.zone.local{border-color:rgba(240,180,106,.38)}
.zone.net{border-color:rgba(238,242,234,.18)}
.zone .zl{position:absolute;top:-11px;left:18px;padding:2px 8px;background:var(--board);border-radius:6px;font:700 12px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--cloud);white-space:nowrap}
.zone.local .zl{color:var(--copper-hi)} .zone.net .zl{color:var(--silk-dim)}
.zone.hidden{opacity:0}
.zone.hot{border-color:var(--led);box-shadow:0 0 0 1px rgba(245,213,71,.3), inset 0 0 60px rgba(245,213,71,.06)}
.zone.hot .zl{color:var(--led)}

/* Pistas */
.tr{fill:none;stroke:var(--copper-dim);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .6s, stroke .35s}
.tr.vis{opacity:.95}
.tr.lit{stroke:var(--copper)}
.tr.live{stroke:var(--copper-hi);stroke-width:4;filter:drop-shadow(0 0 5px rgba(240,180,106,.9))}
.pad{fill:var(--copper);opacity:0;transition:opacity .6s}
.pad.vis{opacity:.9}

/* Chips */
.chip{position:absolute;box-sizing:border-box;border-radius:8px;padding:8px 14px;display:flex;flex-direction:column;justify-content:center;gap:2px;
  background:linear-gradient(180deg,#1c4b39,#123b2c);border:1px solid var(--copper-dim);
  box-shadow:0 3px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
  transition:opacity .55s, background .55s, border-color .55s, box-shadow .55s, filter .55s, transform .4s,
    left 1.5s cubic-bezier(.7,0,.2,1), top 1.5s cubic-bezier(.7,0,.2,1), width 1.5s cubic-bezier(.7,0,.2,1), height 1.5s cubic-bezier(.7,0,.2,1);
  transition-delay:var(--d,0ms)}
.chip::before,.chip::after{content:"";position:absolute;top:12px;bottom:12px;width:5px;background:repeating-linear-gradient(180deg,var(--copper) 0 3px,transparent 3px 8px);opacity:.75;transition:opacity .5s}
.chip::before{left:-6px} .chip::after{right:-6px}
.chip .led{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#2c4a3c;transition:background .4s, box-shadow .4s}
.chip .ana{font:700 10.5px/1.1 var(--display);font-stretch:85%;letter-spacing:.12em;text-transform:uppercase;color:var(--copper-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
.chip .nm{font:700 15.5px/1.15 var(--display);font-stretch:88%;color:var(--silk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .4s}
.chip .sb{font:400 11.5px/1.35 var(--mono);color:var(--silk-dim);white-space:pre-line;transition:opacity .4s}
.chip .capn{position:absolute;right:9px;bottom:6px;font:600 10px/1 var(--mono);color:var(--silk-faint);opacity:0;transition:opacity .4s}
.chip.on .led{background:#2fa36b;box-shadow:0 0 6px rgba(63,208,138,.6)}
.chip.socket,.chip.peek{background:rgba(255,255,255,.012);border:1px dashed rgba(157,179,166,.32);box-shadow:none}
.chip.socket::before,.chip.socket::after,.chip.peek::before,.chip.peek::after{opacity:.12}
.chip.socket .nm,.chip.socket .sb,.chip.peek .nm,.chip.peek .sb{opacity:0}
.chip.socket .ana{color:var(--silk-faint)}
.chip.socket .capn,.chip.peek .capn{opacity:1}
.chip.peek{border-color:var(--led);box-shadow:0 0 0 1px rgba(245,213,71,.25), 0 0 24px rgba(245,213,71,.18)}
.chip.peek .ana{color:var(--led)}
.chip.hidden{opacity:0;transform:scale(.92);pointer-events:none}
.chip.hot{border-color:var(--led);box-shadow:0 0 0 1px var(--led), 0 0 30px rgba(245,213,71,.35)}
.chip.hot .led{background:var(--led);box-shadow:0 0 10px var(--led);animation:blink 1s steps(2) infinite}
.chip.alert{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad), 0 0 34px rgba(255,107,107,.45)}
.chip.alert .led{background:var(--bad);box-shadow:0 0 10px var(--bad);animation:blink .6s steps(2) infinite}
.chip.ok{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok), 0 0 30px rgba(63,208,138,.35)}
.chip.ok .led{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.chip.warn{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn), 0 0 30px rgba(240,162,59,.35)}
.chip.warn .led{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.chip.dead{filter:grayscale(1) brightness(.6);opacity:.45}
.chip.ping{animation:ping .55s}
.chip.cli{border-radius:32px;padding-left:58px;background:linear-gradient(180deg,#1a4636,#133a2d)}
.chip.cli::before,.chip.cli::after{display:none}
.chip .av{position:absolute;left:12px;top:50%;width:34px;height:34px;margin-top:-17px;border-radius:50%;display:grid;place-items:center;
  font:800 15px/1 var(--display);color:#14281f;background:var(--silk-2)}
.chip.cli.alert .av{background:var(--bad)} .chip.cli.ok .av{background:var(--ok)} .chip.cli.hot .av{background:var(--led)}
.chip.big{justify-content:flex-start;padding-top:12px;background:linear-gradient(180deg,#183f31,#0f3226)}
.chip.big .nm{font-size:22px}
.chip.vm{background:rgba(6,26,20,.75);border:1px solid var(--line);padding:8px 9px;justify-content:flex-start}
.chip.vm::before,.chip.vm::after{display:none}
.chip.vm .nm{font-size:13px} .chip.vm .sb{font-size:11px}
.chip.cpu{background:radial-gradient(circle at 30% 20%,#2c7056,#123b2c 70%);border-color:var(--copper)}
.chip.cpu .nm{font-size:14px}
.chip.cpu.incloud{padding:6px 8px}
.chip.cpu.incloud .nm{font-size:13px}
.chip.cli .nm{font-size:16px}
.chip.danger{border-color:#8a3a3a}

/* Mensajes */
.pk-lbl rect{fill:rgba(7,25,19,.93);stroke-width:1.2}
.pk-lbl text{font:700 14px var(--body);fill:var(--silk)}

/* Bocadillos */
.call{position:absolute;max-width:270px;box-sizing:border-box;padding:9px 13px;border-radius:12px;background:rgba(7,25,19,.96);
  border:1px solid var(--silk-dim);font:700 15px/1.32 var(--body);color:var(--silk);box-shadow:0 14px 34px rgba(0,0,0,.45);animation:pop .45s both;z-index:4}
.call.bad{border-color:var(--bad)} .call.bad::first-line{color:#ffd0d0}
.call.ok{border-color:var(--ok)} .call.warn{border-color:var(--warn)} .call.tok{border-color:var(--cloud)}
.call .ct{display:block;font:700 10px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;margin-bottom:5px}
.call.bad .ct{color:var(--bad)} .call.ok .ct{color:var(--ok)} .call.warn .ct{color:var(--warn)} .call.tok .ct{color:var(--cloud)} .call.info .ct{color:var(--silk-dim)}

/* Panel de texto */
.wm{position:absolute;right:-6px;top:-24px;font:900 210px/1 var(--display);font-stretch:125%;color:transparent;-webkit-text-stroke:1.5px rgba(200,135,58,.22);pointer-events:none;user-select:none;z-index:0}
.panel > *{position:relative;z-index:1}
.panel > .wm{position:absolute;z-index:0}
.kick{font:700 12.5px/1.3 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--copper-hi);margin:0}
.title{font:800 clamp(28px,2.9vw,54px)/1.03 var(--display);font-stretch:108%;margin:0;text-wrap:balance;color:var(--silk)}
.quote{margin:0;padding:6px 0 6px 16px;border-left:3px solid var(--led);font:400 clamp(17px,1.3vw,22px)/1.42 var(--body);color:var(--silk)}
.quote .who{display:block;font:700 11px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--led);margin-bottom:6px}
.beats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.beat{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;opacity:.5;transition:opacity .4s}
.beat.cur{opacity:1}
.beat .bi{font-size:19px;line-height:1.3;text-align:center}
.beat .bh{font:700 12.5px/1.3 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--copper-hi);margin:2px 0 0}
.beat.cur .bh{color:var(--led)}
.beat .bt{font:400 clamp(16px,1.15vw,19.5px)/1.48 var(--body);margin:4px 0 0;color:var(--silk-2)}
.beat.cur .bt{color:var(--silk)}
.beat.enter{animation:rise .55s both}
.beat:not(.cur) .bt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.beat:not(.cur) .qa,.beat:not(.cur) .ctx,.beat:not(.cur) .cards,.beat:not(.cur) .blist{display:none}
.qa{margin:8px 0 0;padding:10px 12px;border-radius:10px;background:rgba(90,180,240,.07);border:1px solid rgba(90,180,240,.28)}
.qa .q{font:italic 400 clamp(15px,1.05vw,18px)/1.45 var(--body);color:var(--silk-2);margin:0}
.qa .a{font:700 clamp(15px,1.05vw,18px)/1.45 var(--body);color:var(--silk);margin:6px 0 0}
.qa .pg{font:600 12px/1.3 var(--mono);color:var(--cloud);margin:0 0 6px}
.blist{margin:6px 0 0;padding-left:18px;color:var(--silk-2);font:400 clamp(15px,1.05vw,18px)/1.45 var(--body)}
.blist li{margin:2px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:8px}
.card{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.card b{display:block;font:800 18px/1.1 var(--display);font-stretch:95%;color:var(--silk)}
.card span{font:400 13.5px/1.35 var(--body);color:var(--silk-dim)}
.comp{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--copper-dim);background:rgba(200,135,58,.07);animation:rise .5s both}
.comp .cl{font:700 10.5px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--copper-hi);width:100%}
.comp b{font:700 16px/1.2 var(--display);font-stretch:95%}
.comp i{font-style:normal;color:var(--copper-hi)}
.ctx{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.ctx .row{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:center;font:600 11px/1 var(--mono);color:var(--silk-faint)}
.ctx .bar{display:flex;height:12px;gap:2px}
.ctx .bar i{display:block;height:100%;border-radius:2px;transition:width .8s}
.ctx .p{background:#d9c9a0} .ctx .h{background:var(--silk-dim)} .ctx .m{background:var(--copper)} .ctx .y{background:var(--led)} .ctx .c{background:var(--cloud)}
.ctx .leg{font:400 12px/1.4 var(--mono);color:var(--silk-faint);margin-top:4px}

/* Portada y cierre */
.app[data-layout="cover"] .main,.app[data-layout="full"] .main{grid-template-columns:minmax(0,1fr)}
.app[data-layout="cover"] .stage,.app[data-layout="full"] .stage{grid-column:1;grid-row:1}
.app[data-layout="cover"] .panel{grid-column:1;grid-row:1;z-index:3;align-self:stretch;width:min(640px,48%);justify-content:center;padding:28px 90px 28px 36px;
  background:linear-gradient(90deg,rgba(7,29,22,.97) 62%,rgba(7,29,22,0));border-radius:16px 0 0 16px;pointer-events:none}
.app[data-layout="cover"] .panel *{pointer-events:auto}
.hero{font:900 clamp(56px,7.4vw,138px)/.88 var(--display);font-stretch:125%;margin:0;letter-spacing:-.01em;color:var(--silk);text-wrap:balance}
.hero .h2{display:block;font-weight:300;font-stretch:70%;color:var(--copper-hi);font-size:.42em;letter-spacing:.02em;margin-top:.25em}
.lede{font:400 clamp(18px,1.5vw,25px)/1.4 var(--body);color:var(--silk-2);margin:0;max-width:34ch}
.meta{font:600 13px/1.6 var(--mono);color:var(--silk-dim);margin:0}
.hint{font:700 12px/1 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--led);margin:6px 0 0;animation:blink 1.6s ease-in-out infinite}
.app[data-layout="full"] .panel{grid-column:1;grid-row:1;z-index:3;align-self:end;justify-self:start;width:min(500px,42%);max-height:72%;margin:0 0 18px 18px;
  padding:18px 20px;border-radius:14px;background:rgba(7,25,19,.94);border:1px solid var(--copper-dim);box-shadow:0 20px 50px rgba(0,0,0,.5);gap:10px}
.app[data-layout="full"] .title{font-size:clamp(22px,1.7vw,32px)}
.stepn{font:600 12px/1 var(--mono);color:var(--silk-dim)}
.fh{font:800 clamp(20px,1.6vw,28px)/1.15 var(--display);font-stretch:100%;margin:0;color:var(--led)}
.ft{font:400 clamp(16px,1.15vw,19px)/1.5 var(--body);margin:0;color:var(--silk)}

/* Lámina alternativa (método, deudas, agenda) */
.alt{position:absolute;inset:0;display:grid;place-items:center;padding:18px;animation:fade .6s both}
.alt svg{width:100%;height:100%;max-height:100%}
.alt text{font-family:var(--body)}
.alt .ttl{font:800 22px var(--display);fill:var(--silk)}
.alt .lab{font:700 18px var(--display);fill:var(--silk)}
.alt .sub{font:400 14px var(--mono);fill:var(--silk-dim)}
.alt .small{font:600 13px var(--mono);fill:var(--silk-dim)}
.alt .st circle.n{fill:var(--board-2);stroke:var(--copper-dim);stroke-width:2;transition:all .5s}
.alt .st.on circle.n{stroke:var(--led);stroke-width:3;filter:drop-shadow(0 0 12px rgba(245,213,71,.7))}
.alt .st.done circle.n{stroke:var(--copper)}
.alt .orbit{animation:spin 7s linear infinite;transform-origin:400px 290px}
.alt .ring{fill:none;stroke:var(--copper-dim);stroke-width:3;stroke-dasharray:6 10;animation:dash 2.2s linear infinite}
.alt .row{transition:opacity .5s}
.alt .row.dim{opacity:.25}
.alt .draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s ease-out forwards}
.alt .blk{transition:opacity .5s}

/* Tira laboratorio → teoría */
.strip{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:4px 0 2px}
.strip.off{opacity:.38}
.st5{position:relative;display:flex;flex-direction:column;gap:3px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.025);min-width:0;transition:all .45s}
.st5:not(:last-child)::after{content:"";position:absolute;right:-13px;top:50%;width:14px;height:2px;background:var(--copper-dim)}
.st5 .sl{font:700 12px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--silk-dim);white-space:nowrap}
.st5 .sd{font:400 12.5px/1.3 var(--mono);color:var(--silk-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st5.done{border-color:var(--copper-dim)} .st5.done .sl{color:var(--copper-hi)}
.st5.on{border-color:var(--led);background:rgba(245,213,71,.08);box-shadow:0 0 22px rgba(245,213,71,.18)}
.st5.on .sl{color:var(--led)} .st5.on .sd{color:var(--silk)}
.electron{position:absolute;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--led);box-shadow:0 0 14px var(--led),0 0 4px #fff;
  transition:left .9s cubic-bezier(.65,0,.35,1), opacity .4s;pointer-events:none}

/* Controles */
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{font:700 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;color:var(--silk)}
.btn:hover{border-color:var(--copper);background:rgba(200,135,58,.1)}
.btn[aria-pressed="true"]{border-color:var(--led);color:var(--led)}
.btn.big{font-size:15px;padding:9px 16px}
.prog{flex:1;display:flex;gap:3px;min-width:120px}
.seg{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.08);cursor:pointer;border:0;padding:0}
.seg.done{background:var(--copper)}
.seg.cur{background:linear-gradient(90deg,var(--led) var(--p,0%),rgba(255,255,255,.14) var(--p,0%))}

// ── Construcción de la placa
function pathD(pts, rad = 10) {
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
    const l1 = Math.hypot(x1 - x0, y1 - y0), l2 = Math.hypot(x2 - x1, y2 - y1);
    const r = Math.min(rad, l1 / 2, l2 / 2);
    d += ` L${x1 - (x1 - x0) / l1 * r} ${y1 - (y1 - y0) / l1 * r} Q${x1} ${y1} ${x1 + (x2 - x1) / l2 * r} ${y1 + (y2 - y1) / l2 * r}`;
  }
  const z = pts[pts.length - 1];
  return d + ` L${z[0]} ${z[1]}`;
}
function svgEl(tag, attrs = {}) { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; }

    const pads = [e.pts[0], e.pts[e.pts.length - 1]].map(([x, y]) => { const c = svgEl('circle', {cx: x, cy: y, r: 4.5, class: 'pad'}); g.append(c); return c; });
    tracesSvg.append(g);
    edgeEl[e.id] = {p, pads};
    e.cum = [0];
    for (let i = 1; i < e.pts.length; i++) e.cum.push(e.cum[i - 1] + Math.hypot(e.pts[i][0] - e.pts[i - 1][0], e.pts[i][1] - e.pts[i - 1][1]));
    e.len = e.cum[e.cum.length - 1];
  }
  for (const c of CHIPS) {
    const d = document.createElement('div');
    d.className = 'chip socket';
    if (c.cli) d.classList.add('cli');
    if (c.big) d.classList.add('big');

      `<span class="capn">${!c.vm && c.ch >= 0 ? 'cap. ' + c.ch : ''}</span>`;
    chipsEl.append(d); chipEl[c.id] = d;
  }
  // Raíl de capítulos
  const rail = $('#rail'), acts = {1:'I', 3:'II', 12:'III', 16:'+'};
  if (typeof RAIL !== 'undefined') {
    // Bloques (la intro): cada botón lleva a la primera escena de su bloque

    RAIL.forEach(([label, id], i) => {

      b.addEventListener('click', () => { const k = SCENES.findIndex(sc => sc.id === id); if (k >= 0) go(k, 0); });

function go(s, b, {anim = true} = {}) {
  s = Math.max(0, Math.min(SCENES.length - 1, s));
  const sc = SCENES[s];
  b = Math.max(0, Math.min(sc.beats.length - 1, b));
  const changed = !rendered || s !== state.s;
  runTok++; clearTimeout(autoT);
  fx.querySelectorAll(':scope > g').forEach(g => g.remove());
  state.s = s; state.b = b;
  app.dataset.layout = sc.layout === 'alt' ? 'board' : sc.layout;
  const bt = sc.beats[b];
  const live = computeLive(s, b, !anim || !bt.flow);
  applyLive(live);
  renderAlt(sc, b, changed);
  renderPanel(sc, b, changed);
  renderStrip(sc, b);
  renderChrome(s, b);
  camera(bt.focus || sc.focus, !rendered);
  try { history.replaceState(null, '', '#' + hashOf(sc)); } catch (_) {}
  rendered = true;
  const tok = runTok;
  const after = () => { if (tok !== runTok) return; if (cur.ambient) ambient(tok); if (state.auto) scheduleAuto(tok); };
  if (anim && bt.flow) runFlow(bt.flow, tok).then(after); else after();
}
function next() {
  const sc = SCENES[state.s];
  if (state.b < sc.beats.length - 1) go(state.s, state.b + 1);
  else if (state.s < SCENES.length - 1) go(state.s + 1, 0);
  else setAuto(false);
}
function prev() {
  if (state.b > 0) go(state.s, state.b - 1, {anim: false});
  else if (state.s > 0) go(state.s - 1, SCENES[state.s - 1].beats.length - 1, {anim: false});
}
function scheduleAuto(tok) {
  const sc = SCENES[state.s], bt = sc.beats[state.b];
  const words = ((bt.t || '') + ' ' + (bt.q || '') + ' ' + (bt.a || '') + ' ' + (bt.list || []).join(' ')).length;
  const dwell = sc.ambient || bt.ambient ? 6500 : Math.min(11000, 2600 + words * 32);

}

      case 'r': case 'R': go(state.s, state.b); break;
      case 'c': case 'C': openLink('colab'); break;
      case 't': case 'T': openLink('teoria'); break;
    }
  });
  let rt = 0;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { camera(lastFocus, true); renderStrip(SCENES[state.s], state.b); }, 120); });
}
init();
</script>
